<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' dota-asset: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wardly Overlay</title>
    <link rel="stylesheet" href="../assets/fonts/fonts.css">
    <link rel="stylesheet" href="../assets/ui/tokens.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="locked">
    <main id="overlay-root" class="overlay-root">
      <section id="overlay-shell" class="overlay-shell status" aria-live="polite">
        <div class="top-row">
          <span class="dot" aria-hidden="true"></span>
          <span id="label" class="label">Coach</span>
          <span id="priority" class="priority"></span>
        </div>
        <div id="status-row" class="status-row hidden"></div>
        <p id="action" class="action"></p>
        <!-- Item icons: the build on the plan card, the usual start on the empty-bag card. -->
        <div id="items-row" class="items-row hidden" aria-hidden="true"></div>
        <p id="reason" class="reason"></p>
        <!-- Where the card points on a small map, with the player's own dot (map-marker.js). -->
        <div id="hint-map" class="hint-map hidden" aria-hidden="true">
          <img id="hint-map-art" alt="">
          <i class="mk mk-target"></i>
          <i class="mk mk-player"></i>
        </div>
      </section>
      <!-- The next events for the player's position (runes, stacks, Roshan, Aegis). -->
      <ul id="timer-strip" class="timer-strip hidden" aria-label="Timers"></ul>
    </main>
    <script src="../renderer/dota-data.js"></script>
    <script src="../renderer/dota-icons.js"></script>
    <script src="./voice.js"></script>
    <script src="./map-marker.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
