name: Website

# Publishes site/ to GitHub Pages (Settings -> Pages -> Source: GitHub
# Actions); see site/README.md. Every change of site/ merged into main goes
# out by itself. The news workflows' own commits (made with the workflow token,
# which starts no other workflow) call this one directly.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
  # news.yml, patch.yml and hero-week.yml publish right after their commit.
  workflow_call:
    inputs:
      ref:
        description: "The commit to publish"
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
