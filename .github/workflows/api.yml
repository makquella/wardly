name: API

# Tests the Cloudflare Worker in services/api on every pull request that touches
# it, and deploys it from main (or by hand). The deploy creates the D1 database
# and the R2 bucket when they are missing, applies the migrations and sets the
# Worker's secrets from the repository secrets. See docs/DATA_PLAN.md.
#
# Repository settings: secret CLOUDFLARE_API_TOKEN (Workers edit, D1 edit,
# Workers R2 Storage edit), variable (or secret) CLOUDFLARE_ACCOUNT_ID; optional
# secrets TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, API_ADMIN_TOKEN.
on:
  pull_request:
    paths: ["services/api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["services/api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Bundle Worker and apply local D1 migrations
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --no-install wrangler deploy --dry-run --outdir "${{ runner.temp }}/worker-bundle"
          npx --no-install wrangler d1 migrations apply dota-ai-coach --local --persist-to "${{ runner.temp }}/worker-d1"

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE: dota-ai-coach
      BUCKET: dota-ai-coach-reports
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci

      - name: Check the Cloudflare settings
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable in the repository settings."
            exit 1
          fi

      - name: D1 database
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let raw = ""; process.stdin.on("data", (c) => (raw += c)).on("end", () => {
                const list = JSON.parse(raw.slice(raw.indexOf("[")));
                const db = list.find((d) => d.name === process.env.DATABASE);
                process.stdout.write(db ? String(db.uuid || db.id || db.database_id) : "");
              });'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create "$DATABASE"
            id=$(find_id)
          fi
          if [ -z "$id" ]; then echo "::error::Could not find or create the D1 database"; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          echo "D1 $DATABASE: $id"

      # R2 must be switched on once in the dashboard (R2 → Purchase R2 Plan, free
      # tier). Until then the Worker keeps the reports in D1 (see src/index.js).
      - name: R2 bucket (optional)
        run: |
          # Only "R2 is not enabled" (code 10042) means D1 storage: any other
          # failure stops the deploy, so a Worker that already keeps reports in
          # R2 never loses its bucket binding.
          if ! list=$(npx wrangler r2 bucket list 2>&1); then
            echo "$list" | tail -5
            if ! echo "$list" | grep -q "code: 10042"; then
              echo "::error::Could not list R2 buckets (see above)."
              exit 1
            fi
            echo "::warning::R2 is not enabled for this account: reports are stored in D1. Enable R2 in the Cloudflare dashboard to move new reports to R2."
            sed -i '/^\[\[r2_buckets\]\]/,/^$/d' wrangler.toml
          elif echo "$list" | grep -qE "(^|[^a-z0-9-])$BUCKET([^a-z0-9-]|$)"; then
            echo "R2 $BUCKET exists"
          else
            npx wrangler r2 bucket create "$BUCKET"
          fi
          grep -q r2_buckets wrangler.toml && echo "storage: R2" || echo "storage: D1"

      - name: R2 lifecycle for match recordings
        # A safety net for the cron cleanup (src/index.js): objects under
        # sessions/ expire after 61 days even if a row was lost. Idempotent.
        run: |
          if grep -q r2_buckets wrangler.toml; then
            if npx wrangler r2 bucket lifecycle list "$BUCKET" 2>&1 | grep -q "wardly-sessions-61d"; then
              echo "lifecycle rule exists"
            else
              npx wrangler r2 bucket lifecycle add "$BUCKET" wardly-sessions-61d sessions/ --expire-days 61 --force
            fi
          fi

      - name: Migrations
        run: npx wrangler d1 migrations apply "$DATABASE" --remote

      - name: Deploy
        run: npx wrangler deploy | tee deploy.log

      - name: Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
        run: |
          node -e '
            const names = ["TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "ADMIN_TOKEN"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(set));
            console.log("secrets:", Object.keys(set).join(", ") || "none");'
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; fi
          rm -f secrets.json

      - name: Check
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker: $url"
          if [ -n "$url" ]; then curl -fsS "$url/health"; echo; curl -fsS "$url/v1/config"; echo; fi
          curl -fsS https://api.luhovyimvp.dev/health && echo || echo "api.luhovyimvp.dev is not attached yet: Workers → dota-ai-coach-api → Settings → Domains & Routes → Add → Custom domain"
