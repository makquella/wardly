name: Release

# Push a tag "v<version>" (matching frontend/launcher/package.json) to build,
# smoke-test and publish the Windows installer as a GitHub Release. Or run it
# by hand on main (Actions -> Release -> Run workflow): it then releases the
# version from package.json and creates the tag "v<version>" itself when it
# publishes. Installed apps update themselves from the latest release
# (electron-updater reads latest.yml from it), see docs/PACKAGING_WINDOWS.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Select immutable release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Resolve source and release tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          version = json.loads(Path('frontend/launcher/package.json').read_text())['version']
          if re.fullmatch(r'\d+\.\d+\.\d+', version) is None:
              raise SystemExit('Release version must be a plain semver.')
          tag = f'v{version}'
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              if os.environ['GITHUB_REF'] != 'refs/heads/main':
                  raise SystemExit('Run the release by hand only on main.')
              refs = json.loads(subprocess.check_output([
                  'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/matching-refs/tags/{tag}"
              ], text=True))
              if any(ref['ref'] == f'refs/tags/{tag}' for ref in refs):
                  raise SystemExit(f'Tag {tag} already exists; bump the version first.')
          elif os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit(f"Tag {os.environ['GITHUB_REF_NAME']} does not match package version {version}.")
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          subprocess.check_call(['python', 'scripts/verify_source.py', sha])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={sha}\ntag={tag}\n')
          print(f'Selected {tag} from {sha}')
          PY

  validation:
    name: Validate release source
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      # This workflow does its own Windows build with signing and smoke below.
      skip_windows: true

  windows:
    name: Build and publish Windows installer
    needs: [source, validation]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      TAG: ${{ needs.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/launcher/package-lock.json

      - name: Verify validated source before building
        run: python scripts/verify_source.py $env:RELEASE_SHA

      - name: Build backend exe, Electron app and NSIS installer
        # Signing secrets are optional: without them the release is unsigned
        # (see docs/PACKAGING_WINDOWS.md, "Code signing").
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          SIGN_PUBLISHER_NAME: ${{ secrets.SIGN_PUBLISHER_NAME }}
        run: ./scripts/build-windows.ps1

      - name: Check code signatures
        env:
          SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' || secrets.AZURE_SIGNING_ENDPOINT != '' }}
        run: |
          $version = $env:TAG.Substring(1)
          $dist = "frontend/launcher/dist"
          $files = @(
            "$dist/Wardly-Setup-$version.exe",
            "$dist/win-unpacked/Wardly.exe",
            "$dist/win-unpacked/resources/backend/dota-ai-coach-backend.exe"
          )
          $unsigned = @()
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            Write-Host "$file : $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") { $unsigned += $file }
          }
          if ($env:SIGNING_CONFIGURED -eq "true" -and $unsigned) {
            throw "Signing is configured but these files are not validly signed: $($unsigned -join ', ')"
          }
          if ($unsigned) {
            Write-Host "::warning::The release is not code-signed: Windows SmartScreen will warn on install."
          }

      - name: Smoke test (backend /health, app, installer)
        run: ./scripts/smoke-windows.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagArgs = @("--release-tag", $env:TAG)
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $tagArgs += "--allow-missing-tag" }
          python scripts/verify_source.py $env:RELEASE_SHA @tagArgs
          if ($LASTEXITCODE -ne 0) { throw "The source or release tag changed after validation." }
          $version = $env:TAG.Substring(1)
          $dist = "frontend/launcher/dist"
          # electron-updater needs all three: the feed, the installer and its blockmap.
          $files = @(
            "$dist/latest.yml",
            "$dist/Wardly-Setup-$version.exe",
            "$dist/Wardly-Setup-$version.exe.blockmap"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }
          # --target only matters for a manual run: gh then creates the tag on
          # the built commit. For a tag push the tag already exists.
          # Hand-written notes for players when docs/release-notes/<tag>.md exists.
          $notes = "docs/release-notes/$($env:TAG).md"
          $notesArgs = if (Test-Path $notes) { @("--notes-file", $notes) } else { @("--generate-notes") }
          # GitHub answers 5xx now and then (a 504 lost the 0.41.0 run after a
          # full build): try three times; a release that got created before the
          # error only needs its files.
          $done = $false
          foreach ($attempt in 1..3) {
            python scripts/verify_source.py $env:RELEASE_SHA @tagArgs
            if ($LASTEXITCODE -ne 0) { throw "The validated source/tag no longer matches." }
            gh release view $env:TAG *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $env:TAG @files --clobber
            } else {
              gh release create $env:TAG @files --target $env:RELEASE_SHA --title "Wardly $version" @notesArgs
            }
            if ($LASTEXITCODE -eq 0) { $done = $true; break }
            Write-Host "Publishing failed (attempt $attempt), retrying in 30 s"
            Start-Sleep -Seconds 30
          }
          if (-not $done) { throw "gh release create failed three times" }

      - name: Send the installer to VirusTotal
        # Optional (secret VT_API_KEY, the key of a free VirusTotal account).
        # After a successful upload the report's link is added to the release
        # notes; the site shows «Перевірка VirusTotal» only when the notes carry
        # the link for this installer's SHA-256. Never fails the release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./scripts/virustotal-release.ps1 -Tag $env:TAG -Installer "frontend/launcher/dist/Wardly-Setup-$($env:TAG.Substring(1)).exe"

      - name: Post the release to the Telegram channel
        # To https://t.me/wardlydota (variable TELEGRAM_CHANNEL overrides it; secret
        # TELEGRAM_BOT_TOKEN, the bot an admin of the channel): the release's own
        # post from data/news/telegram/<version>.json (scripts/news_telegram.py) as a
        # picture card (drawn with the runner's Chrome) and its caption; the caption
        # as a text post when the card cannot be drawn. A fix without a post is not
        # posted. Never fails the release.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@wardlydota' }}
        run: python scripts/build_news.py telegram-release $env:TAG.Substring(1) --send

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs
          path: |
            ${{ runner.temp }}/smoke-*.json
            ${{ runner.temp }}/launcher.log
          if-no-files-found: ignore
