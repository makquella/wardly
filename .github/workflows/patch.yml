name: Patch notes

# Every few hours: is there a new Dota 2 patch? scripts/build_news.py reads
# Valve's datafeed (the patch list, the notes in Ukrainian and English and the
# names of heroes, abilities and items) and writes
# data/news/patches/<date>-<version>.json; scripts/build_site.py writes its page
# under site/news/ and adds it to the news list. The commit goes to main and the
# site is published. A new patch also goes to the Telegram channel as a picture
# card (scripts/news_cards.py).
#
# For a week after a patch its notes are fetched again: Valve fixes them and the
# Ukrainian translation can come later. Those updates change the page only; the
# Telegram post goes out once, for a new patch. When that post failed, run the
# workflow by hand with the version and "telegram" ticked to send it again.
#
# Telegram: the channel https://t.me/wardlydota (repository variable
# TELEGRAM_CHANNEL overrides it) and the secret TELEGRAM_BOT_TOKEN.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "This patch (e.g. 7.41f) instead of the newest; rewrites its notes"
        type: string
        default: ""
      telegram:
        description: "Send the patch to the Telegram channel, new or not (a retry)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      pushed: ${{ steps.commit.outputs.pushed }}
      version: ${{ steps.patch.outputs.version }}
      new: ${{ steps.patch.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - name: Read Valve's patch notes
        id: patch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            python scripts/build_news.py patch "$VERSION"
          else
            python scripts/build_news.py patch
          fi
      - name: Write the pages
        if: steps.patch.outputs.changed == 'true'
        run: |
          python scripts/build_site.py
          python scripts/build_site.py --check
      - name: Commit to main
        id: commit
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news site
          if git diff --cached --quiet; then
            echo "Nothing new"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "News: patch ${{ steps.patch.outputs.version }}"
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  site:
    needs: post
    if: needs.post.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.post.outputs.sha }}

  telegram:
    needs: [post, site]
    # A new patch, or a manual run asking for the post; never after a failed deploy.
    if: >-
      always() && needs.post.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.site.result)
      && (needs.post.outputs.new == 'true' || inputs.telegram)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.post.outputs.sha || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Send the post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@wardlydota' }}
        run: python scripts/build_news.py telegram-patch "${{ needs.post.outputs.version }}" --send
