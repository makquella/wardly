name: News

# Every Monday: the «Мета тижня» post. scripts/build_news.py reads OpenDota's
# public hero statistics (last 7 days), writes data/news/posts/<date>-meta.json,
# scripts/build_site.py writes its pages under site/news/, the commit goes to
# main, the site is published and the post goes to the Telegram channel: a picture
# card drawn with the runner's Chrome and a short caption (scripts/news_cards.py).
#
# Telegram: the channel https://t.me/wardlydota (repository variable
# TELEGRAM_CHANNEL overrides it) and the secret TELEGRAM_BOT_TOKEN; the bot must be
# an admin of the channel. Without the token the post only appears on the site.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      telegram:
        description: "Send the post to the Telegram channel"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - name: Write this week's post
        id: meta
        run: |
          day=$(date -u +%F)
          python scripts/build_news.py meta --date "$day"
          python scripts/build_site.py
          python scripts/build_site.py --check
          echo "date=$day" >> "$GITHUB_OUTPUT"
      - name: Commit to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news site
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "News: meta of the week ${{ steps.meta.outputs.date }}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  site:
    needs: post
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.post.outputs.sha }}

  telegram:
    needs: [post, site]
    if: github.event_name == 'schedule' || inputs.telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.post.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Send the post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@wardlydota' }}
        run: python scripts/build_news.py telegram-meta "${{ needs.post.outputs.date }}" --send
