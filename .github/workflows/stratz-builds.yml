name: Stratz builds

# Every Tuesday: rebuild data/meta/stratz_builds.json — what Divine and Immortal
# players buy on every hero in every position (the starting purchase and the
# build with its usual minutes), from STRATZ. The app reads the file
# (app/stratz_builds.py) and never asks STRATZ itself: the token allows two IP
# addresses per 15 minutes, so it is used here, on one runner, once a week.
#
# The token is the repository secret STRATZ_TOKEN and reaches the script only
# through the environment. A changed file becomes a pull request (Settings →
# Actions → General → "Allow GitHub Actions to create and approve pull requests").
on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stratz-builds
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: write
      pull-requests: write
    outputs:
      head_sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'
      - name: Rebuild stratz_builds.json
        working-directory: backend
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
        run: python scripts/build_stratz_builds.py
      # A pull request opened with the workflow token starts no CI, so the new
      # file is checked here, before the pull request: a broken export fails the run.
      - name: Check the new file
        working-directory: backend
        run: python -m pytest -q tests/test_stratz_builds.py tests/test_game_plan.py tests/test_gold_tips.py
      - name: Show exact data change summary
        run: git diff --stat -- data/meta/stratz_builds.json >> "$GITHUB_STEP_SUMMARY"
      - name: Open a pull request when it changed
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/stratz-builds
          commit-message: "Refresh high-rank starting items and builds"
          title: "Refresh high-rank starting items and builds"
          body: |
            `backend/scripts/build_stratz_builds.py` rebuilt `data/meta/stratz_builds.json` from STRATZ (Divine–Immortal games).
            The overlay's start card, the game plan and the quick-buy step use it after the next release.
            Full reusable CI directly checks this PR head; inspect the generated-refresh validation check before merge.
          add-paths: data/meta/stratz_builds.json
          delete-branch: true
  validate:
    needs: refresh
    if: needs.refresh.outputs.head_sha != ''
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/refresh-validation.yml
    with:
      source_sha: ${{ needs.refresh.outputs.head_sha }}
