name: Fuzz live GSI

# Every night: 10 000 broken GSI payloads (a new seed each run) through
# POST /gsi -> /overlay/recommendation -> /gsi/status -> /player. A 5xx fails the
# run and its log prints the payload and the seed to reproduce it locally:
#   cd backend && python scripts/fuzz_live_gsi.py --payloads 10000 --seed <seed>
# The pull request CI runs a short fixed-seed version (tests/test_fuzz_live_gsi.py).
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      payloads:
        description: "How many payloads"
        default: "10000"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'
      - name: Fuzz
        env:
          PAYLOADS: ${{ github.event.inputs.payloads || '10000' }}
          SEED: ${{ github.run_number }}
          OPENDOTA_ENABLED: "false"
          USE_LLM: "false"
        run: python scripts/fuzz_live_gsi.py --payloads "$PAYLOADS" --seed "$SEED"
