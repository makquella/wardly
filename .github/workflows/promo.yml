name: Promo

# Wardly Marketing Engine (docs/MARKETING_ENGINE.md). Three times a week:
# pick a topic from the project's data, write the script, voice it
# (ElevenLabs), render a 1080x1920 video from Valve's hero animations and
# ability clips (headless Chrome + ffmpeg), check it,
# and send it to the developer's Telegram for approval. Nothing is published
# here: the buttons in Telegram go to the Worker (services/api/src/promo.js),
# which publishes only after «✅ Всюди», «📣 Лише Telegram» or «▶️ Лише YouTube».
#
# Selected voice: Alex Nekrasov, eleven_v4, UK, stability 0.5, speed 1.0.
# Manual voice_preset=custom uses optional ELEVENLABS_* repository variables.
# Secrets: ELEVENLABS_API_KEY (the voice), API_ADMIN_TOKEN, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID (the developer's chat). Without the Telegram ones the video
# is only built and kept as an artifact.
on:
  schedule:
    - cron: "23 14 * * 2,4,6"
  workflow_dispatch:
    inputs:
      format:
        description: "Format (auto: the rotation picks)"
        type: choice
        options: [auto, draft, coach, meta, hero, fact, release]
        default: auto
      voice_preset:
        description: "Narration (Alex natural is the selected variant A; custom uses variables)"
        type: choice
        options: [alex-natural, custom]
        default: alex-natural
      voice_lab:
        description: "Voice comparison (catalog checks models/voices without TTS)"
        type: choice
        options: ["off", catalog, A, B, C, D]
        default: "off"
      voice_catalog:
        description: "Verified voice-catalog JSON from a catalog run (optional)"
        type: string
        default: ""
      send:
        description: "Send to Telegram for approval"
        type: boolean
        default: true
      beta_campaign:
        description: "Beta recruitment videos (review builds, private delivery, Shorts buttons); release: the 0.57 carry pair"
        type: choice
        options: ["off", build, validate, deliver, shorts, audit, outreach, series, release]
        default: "off"
      beta_run_id:
        description: "Reviewed artifact run ID (required for deliver/shorts/series)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ inputs.beta_campaign != '' && inputs.beta_campaign != 'off' && 'promo-beta' || inputs.voice_lab != '' && inputs.voice_lab != 'off' && format('promo-voice-{0}', inputs.voice_lab) || 'promo' }}
  cancel-in-progress: false

env:
  API_URL: https://api.luhovyimvp.dev

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}
          fetch-depth: 0 # release notes dates (topics.latest_release)
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            scripts/promo/requirements.txt
      - name: Install
        # A beta build needs Playwright whatever voice_lab says (the voice lab is
        # off in beta mode); only the read-only beta steps skip the install.
        if: (inputs.voice_lab != 'catalog' || (inputs.beta_campaign != '' && inputs.beta_campaign != 'off')) && inputs.beta_campaign != 'audit' && inputs.beta_campaign != 'outreach'
        run: |
          # requirements-dev: the coach video runs the real advice pipeline
          # through FastAPI's TestClient (backend/scripts/simulate_live_gsi.py),
          # which needs httpx.
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          python -m pip install -r scripts/promo/requirements.txt
          python -m playwright install --with-deps chromium
          ffmpeg_exe="$(python -c 'from scripts.promo import render; print(render.ffmpeg())')"
          ffmpeg_version="$("$ffmpeg_exe" -version)"
          echo "${ffmpeg_version%%$'\n'*}"
      - uses: actions/setup-node@v6
        if: inputs.beta_campaign == 'audit' || inputs.beta_campaign == 'outreach'
        with:
          node-version-file: .node-version
      - name: Audit published beta Shorts (read only)
        if: inputs.beta_campaign == 'audit'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: node scripts/promo/youtube_audit.mjs
      - name: Prepare free outreach pack for the owner
        if: inputs.beta_campaign == 'outreach'
        env:
          SEND_PREVIEW: ${{ inputs.send }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: node scripts/promo/beta_outreach.mjs
      - name: What worked (format weights)
        if: (inputs.voice_lab == '' || inputs.voice_lab == 'off') && (inputs.beta_campaign == '' || inputs.beta_campaign == 'off')
        env:
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
        run: python -m scripts.promo.weights
      - name: Restore reviewed Sven pair for six-video series
        if: inputs.beta_campaign == 'series'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_RUN_ID: ${{ inputs.beta_run_id }}
        run: |
          if ! [[ "$BETA_RUN_ID" =~ ^[0-9]+$ ]]; then exit 1; fi
          gh run download "$BETA_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "promo-$BETA_RUN_ID" --dir promo-out/sven
      - name: Build four follow-up beta Shorts
        if: inputs.beta_campaign == 'series'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python -m scripts.promo.beta_series --out promo-out
      - name: Verify follow-up narration and make six-video manifest
        if: inputs.beta_campaign == 'series'
        run: |
          python -m pip install faster-whisper==1.2.1
          python -m scripts.promo.beta_series --out promo-out --speech-check
      - name: Build the video
        if: (inputs.voice_lab == '' || inputs.voice_lab == 'off') && (inputs.beta_campaign == '' || inputs.beta_campaign == 'off')
        env:
          FORMAT: ${{ inputs.format }}
          GITHUB_TOKEN: ${{ github.token }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.voice_preset == 'custom' && vars.ELEVENLABS_VOICE_ID || '9Sj8ugvpK1DmcAXyvi3a' }}
          ELEVENLABS_VOICE_NAME: ${{ inputs.voice_preset == 'custom' && vars.ELEVENLABS_VOICE_NAME || '' }}
          ELEVENLABS_MODEL: ${{ inputs.voice_preset == 'custom' && vars.ELEVENLABS_MODEL || 'eleven_v4' }}
          ELEVENLABS_LANGUAGE: ${{ inputs.voice_preset == 'custom' && vars.ELEVENLABS_LANGUAGE || 'uk' }}
          ELEVENLABS_STABILITY: ${{ inputs.voice_preset == 'custom' && vars.ELEVENLABS_STABILITY || '0.5' }}
          ELEVENLABS_SPEED: ${{ inputs.voice_preset == 'custom' && vars.ELEVENLABS_SPEED || '1.0' }}
          ELEVENLABS_CONTINUOUS: ${{ inputs.voice_preset == 'custom' && vars.ELEVENLABS_CONTINUOUS || 'true' }}
          RECORD_HISTORY: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error title=Promo voice::ELEVENLABS_API_KEY is not set: add it in Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          args=(--out promo-out)
          if [ "$RECORD_HISTORY" = true ]; then args+=(--record); fi
          if [ -n "$FORMAT" ] && [ "$FORMAT" != auto ]; then args+=(--format "$FORMAT"); fi
          # A crash shows up as a check annotation too (the job log is not
          # always at hand); quality findings annotate themselves.
          status=0
          python -m scripts.promo.package "${args[@]}" 2> promo-stderr.log || status=$?
          cat promo-stderr.log >&2
          if [ "$status" -ne 0 ]; then
            echo "::error title=Promo build::$(tail -n 1 promo-stderr.log)"
            exit "$status"
          fi
      - name: Compare Ukrainian male voices
        if: inputs.voice_lab != '' && inputs.voice_lab != 'off' && (inputs.beta_campaign == '' || inputs.beta_campaign == 'off')
        env:
          VOICE_VARIANT: ${{ inputs.voice_lab }}
          VOICE_CATALOG: ${{ inputs.voice_catalog }}
          SEND_PREVIEW: ${{ inputs.send }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: |
          args=(--out promo-out --variant "$VOICE_VARIANT")
          if [ -n "$VOICE_CATALOG" ]; then
            python -c 'import os,json; from pathlib import Path; Path("voice-catalog.json").write_text(json.dumps(json.loads(os.environ["VOICE_CATALOG"])))'
            args+=(--catalog voice-catalog.json)
          fi
          if [ "$SEND_PREVIEW" = true ] && [ "$VOICE_VARIANT" != catalog ]; then args+=(--send); fi
          python -m scripts.promo.experiments "${args[@]}"
      - name: Restore beta build or reusable narration
        if: inputs.beta_campaign == 'validate' || (inputs.beta_campaign == 'build' && inputs.beta_run_id != '')
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_RUN_ID: ${{ inputs.beta_run_id }}
        run: |
          if ! [[ "$BETA_RUN_ID" =~ ^[0-9]+$ ]]; then exit 1; fi
          gh run download "$BETA_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "promo-$BETA_RUN_ID" --dir promo-out
      - name: Build private beta recruitment pair
        if: inputs.beta_campaign == 'build'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          status=0
          python -m scripts.promo.beta --out promo-out 2> beta-stderr.log || status=$?
          cat beta-stderr.log >&2
          if [ "$status" -ne 0 ]; then
            echo "::error title=Beta build::$(tail -n 1 beta-stderr.log)"
            exit "$status"
          fi
      - name: Build the 0.57 release pair (20 carries)
        # scripts/promo/release_carry.py: built and checked like a beta pair, then
        # beta_campaign=shorts with this run's ID sends it with the YouTube button.
        if: inputs.beta_campaign == 'release'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          status=0
          python -m scripts.promo.beta --out promo-out --creative carry-plans-0.57 2> release-stderr.log || status=$?
          cat release-stderr.log >&2
          if [ "$status" -ne 0 ]; then
            echo "::error title=Release build::$(tail -n 1 release-stderr.log)"
            exit "$status"
          fi
      - name: Check beta narration independently
        if: inputs.beta_campaign == 'build' || inputs.beta_campaign == 'validate' || inputs.beta_campaign == 'release'
        run: |
          python -m pip install faster-whisper==1.2.1
          python -m scripts.promo.beta --out promo-out --speech-check
      - name: Restore the reviewed beta pair
        if: inputs.beta_campaign == 'deliver' || inputs.beta_campaign == 'shorts'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_RUN_ID: ${{ inputs.beta_run_id }}
        run: |
          if ! [[ "$BETA_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::beta_run_id must be the reviewed build run ID"
            exit 1
          fi
          gh run download "$BETA_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "promo-$BETA_RUN_ID" --dir promo-out
      - name: Privately deliver the reviewed beta MP4s
        if: inputs.beta_campaign == 'deliver' && inputs.send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: python -m scripts.promo.beta --out promo-out --deliver-only
      - name: Send reviewed beta pair with YouTube Shorts buttons
        if: inputs.beta_campaign == 'shorts' && inputs.send
        env:
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: python -m scripts.promo.beta --out promo-out --shorts-approval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo-${{ github.run_id }}
          path: promo-out
          retention-days: 7
      - name: Send for approval
        if: (inputs.beta_campaign == '' || inputs.beta_campaign == 'off') && (inputs.voice_lab == '' || inputs.voice_lab == 'off') && (github.event_name == 'schedule' || inputs.send)
        env:
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$API_ADMIN_TOKEN" ] || [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::API_ADMIN_TOKEN, TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing: the video stays an artifact"
            exit 0
          fi
          status=0
          python -m scripts.promo.send promo-out 2> promo-send-stderr.log || status=$?
          cat promo-send-stderr.log >&2
          if [ "$status" -ne 0 ]; then
            echo "::error title=Promo send::$(tail -n 1 promo-send-stderr.log)"
            exit "$status"
          fi
      - name: Remember what was made
        if: (inputs.beta_campaign == '' || inputs.beta_campaign == 'off') && github.ref == 'refs/heads/main' && (inputs.voice_lab == '' || inputs.voice_lab == 'off')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/promo/history.json data/promo/weights.json 2>/dev/null || git add data/promo/history.json
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Promo: $(python -c 'import json;h=json.load(open("data/promo/history.json"));print(h[-1]["format"]+" "+h[-1]["topic"])')"
            git push origin HEAD:main
          fi
