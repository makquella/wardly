name: CI

on:
  push:
    branches: [main]
  # All PRs, including ones stacked on another feature branch.
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable commit selected by the caller
        required: true
        type: string
      skip_windows:
        description: Caller performs its own signed Windows build and smoke
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Determine Windows validation scope
    runs-on: ubuntu-latest
    outputs:
      windows_required: ${{ steps.scope.outputs.windows_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Verify source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: python scripts/verify_source.py "$SOURCE_SHA"
      - name: Determine changed desktop paths
        id: scope
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python scripts/windows_checks.py scope --source "$SOURCE_SHA" --base "$BASE_SHA"

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up the canonical Node version for catalog validation
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      # The release binary, checksum-pinned: the Docker Hub image hit the
      # unauthenticated pull rate limit on hosted runners.
      - name: Validate all workflow syntax and expressions
        env:
          ACTIONLINT_VERSION: 1.7.9
          ACTIONLINT_SHA256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
        working-directory: .
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Install dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'

      - name: Verify source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: python ../scripts/verify_source.py "$SOURCE_SHA"

      - name: Check dependency consistency and Python lockfiles
        run: |
          python -m pip check
          python ../scripts/lock_python_dependencies.py --check

      - name: Lint (ruff check)
        run: ruff check --config pyproject.toml . ../scripts/lock_python_dependencies.py ../scripts/check_types.py ../scripts/verify_source.py ../scripts/windows_checks.py ../scripts/dev.py ../scripts/bump_version.py ../scripts/check_hook.py

      - name: Format check (ruff format)
        run: ruff format --config pyproject.toml --check . ../scripts/lock_python_dependencies.py ../scripts/check_types.py ../scripts/verify_source.py ../scripts/windows_checks.py ../scripts/dev.py ../scripts/bump_version.py ../scripts/check_hook.py

      - name: Type check (pinned mypy, no new debt)
        run: |
          python ../scripts/check_types.py
          python -m mypy --strict ../scripts/check_types.py
          python -m mypy --strict ../scripts/verify_source.py
          python -m mypy --strict ../scripts/windows_checks.py ../scripts/dev.py ../scripts/bump_version.py ../scripts/check_hook.py
          python -m mypy --strict app/coach_evidence.py
          python -m mypy --strict app/job_queue.py
          python -m mypy --strict app/gsi_snapshot.py
          python -m mypy --strict app/demo_overlay_cache.py
          python -m mypy --strict app/player_contracts.py
          python -m mypy --strict --follow-imports=silent app/live_hints.py

      - name: Check backend, package, lock and UK/EN release versions
        run: python ../scripts/bump_version.py --check

      - name: Tests (pytest)
        run: pytest -q

      - name: Byte-compile (compileall)
        run: python -m compileall -q app scripts packaging tests

      - name: Site changelog matches docs/release-notes
        run: python ../scripts/build_changelog.py --check

      - name: Generated site pages match the hero profiles and texts
        run: python ../scripts/build_site.py --check

  frontend:
    name: Frontend (node --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: python scripts/verify_source.py "$SOURCE_SHA"

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Syntax check desktop app (launcher + overlay window)
        working-directory: frontend/launcher
        run: npm run check

      - name: Unit tests (node --test, no dependencies)
        working-directory: frontend/launcher
        run: npm test

  windows-build:
    name: Windows build and installer smoke
    needs: changes
    runs-on: windows-latest
    if: ${{ needs.changes.outputs.windows_required == 'true' && !inputs.skip_windows }}
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/launcher/package-lock.json

      - name: Verify source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: python scripts/verify_source.py $env:SOURCE_SHA

      - name: Check DPAPI secret sealing (backend/app/secret_box.py)
        run: python scripts/check_secret_box.py

      - name: Build backend exe, Electron app and NSIS installer
        run: ./scripts/build-windows.ps1

      - name: Smoke test (backend /health, app, installer)
        run: ./scripts/smoke-windows.ps1

      - name: Verify source after packaging
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: python scripts/verify_source.py $env:SOURCE_SHA

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wardly-windows-installer
          path: frontend/launcher/dist/Wardly-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: |
            ${{ runner.temp }}/smoke-*.json
            ${{ runner.temp }}/launcher.log
          if-no-files-found: ignore

  windows-package:
    # Keep the existing required check context while expensive builds are scoped.
    name: Windows package (PyInstaller + NSIS, /health smoke)
    needs: [changes, windows-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: python scripts/verify_source.py "$SOURCE_SHA"
      - name: Require successful or justified skipped Windows validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.windows-build.result }}
          WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows_required }}
          CALLER_BUILDS_WINDOWS: ${{ inputs.skip_windows || false }}
        run: >-
          python scripts/windows_checks.py summary
          --changes "$CHANGES_RESULT" --build "$BUILD_RESULT"
          --required "$WINDOWS_REQUIRED" --caller-builds-windows "$CALLER_BUILDS_WINDOWS"
