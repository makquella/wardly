# Wardly API — see docs/DATA_PLAN.md. Deployed by .github/workflows/api.yml,
# which creates the D1 database and the R2 bucket when they are missing and puts
# the real database id in place of the zero id below.
name = "dota-ai-coach-api"
main = "src/index.js"
compatibility_date = "2026-09-20"
workers_dev = true

[vars]
REPORTS_ENABLED = "true"
# Match recordings sent by consent (src/session.js). RECORDINGS_SAMPLE is the
# share of installations the server offers the "Send to developer" button to
# (0..1, by a stable hash of the installation id); 1 = everyone, 0 = nobody.
RECORDINGS_ENABLED = "true"
RECORDINGS_SAMPLE = "1"
# Share links point at the site: a Workers route (Cloudflare dashboard) sends
# luhovyimvp.dev/r/* to this Worker.
SHARE_ORIGIN = "https://luhovyimvp.dev"
# Promo engine (src/promo.js, docs/MARKETING_ENGINE.md). Approved videos go to
# this channel and, through Metricool, to these networks. "draft" leaves them
# as Metricool drafts to publish by hand; "publish" schedules them for real.
TELEGRAM_CHANNEL = "@wardlydota"
PROMO_NETWORKS = "instagram,tiktok,youtube"
PROMO_METRICOOL_MODE = "draft"
PROMO_TIMEZONE = "Europe/Kyiv"
PROMO_DELAY_MINUTES = "15"
# Direct publishing (src/social.js). The OAuth redirect URIs to register are
# <PROMO_PUBLIC_ORIGIN>/oauth/<youtube|instagram|tiktok>/callback; Instagram
# fetches the video from <PROMO_PUBLIC_ORIGIN>/m/<key>/video.mp4.
PROMO_PUBLIC_ORIGIN = "https://api.luhovyimvp.dev"
# "inbox": TikTok gets a draft to post from the app (works before TikTok's
# audit); "direct": posted at once (public only after the audit).
TIKTOK_MODE = "inbox"
YOUTUBE_PRIVACY = "public"

[[d1_databases]]
binding = "DB"
database_name = "dota-ai-coach"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "dota-ai-coach-reports"

[triggers]
crons = ["17 3 * * *", "*/5 * * * *"]

[observability]
enabled = true
